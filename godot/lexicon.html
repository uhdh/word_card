<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>활자 도감</title>
  <style>
    @font-face { font-family: neodgm; src: url("./fonts/neodgm.ttf"); font-display: swap; }
    :root {
      --bg: #12101c;
      --card: #252238;
      --line: #4a456e;
      --ink: #e8e4ff;
      --dim: #9aa0c4;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: neodgm, "Malgun Gothic", sans-serif; }
    header {
      position: sticky; top: 0; z-index: 5;
      background: #161326f2; border-bottom: 1px solid var(--line);
      padding: 14px 18px 12px; backdrop-filter: blur(8px);
    }
    .top { display: flex; gap: 16px; align-items: baseline; flex-wrap: wrap; }
    h1 { margin: 0; font-size: 22px; font-weight: 400; letter-spacing: 1px; }
    #count { color: var(--dim); font-size: 13px; }
    .sections { display: flex; gap: 6px; }
    .sections button { padding: 6px 12px; cursor: pointer; }
    .note { color: #c8c4e0; font-size: 12px; text-align: center; line-height: 1.4; }
    .rules { margin: 8px 0 0; color: #d5f5ef; font-size: 12px; line-height: 1.45; white-space: pre-line; }
    .controls { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
    input, select, button {
      font-family: inherit; font-size: 13px; color: var(--ink);
      background: #13111f; border: 1px solid var(--line); border-radius: 6px;
    }
    input { flex: 1; min-width: 220px; padding: 8px 10px; }
    select { padding: 8px 10px; }
    .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
    .tabs button { padding: 6px 10px; cursor: pointer; }
    .tabs button.on { background: #4c1d95; border-color: #7c3aed; color: #ddd6fe; }
    main { padding: 16px 18px 40px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
    .card {
      background: var(--card); border: 1px solid var(--line); border-radius: 8px;
      padding: 12px; display: flex; flex-direction: column; gap: 8px; align-items: center;
    }
    .row { display: flex; gap: 8px; align-items: center; }
    .icon, .glyph {
      width: 128px; height: 128px; border-radius: 8px; background: #13111f; flex: none;
    }
    .icon { image-rendering: pixelated; object-fit: contain; }
    .glyph { display: grid; place-items: center; font-size: 48px; }
    .name { font-size: 16px; line-height: 1.3; text-align: center; }
    .dps { color: #ff9966; font-size: 13px; text-align: center; white-space: pre; }
    .badge { font-size: 11px; padding: 1px 6px; border-radius: 999px; border: 1px solid currentColor; }
    .err { padding: 40px 18px; color: #ff8a8a; }
  </style>
</head>
<body>
  <header>
    <div class="top">
      <h1 id="title">활자 도감</h1>
     <div class="sections" id="sections">
       <button type="button" data-section="words" class="on">활자</button>
       <button type="button" data-section="monsters">몬스터</button>
       <button type="button" data-section="relics">유물</button>
       <button type="button" data-section="projectiles">투사체</button>
     </div>
      <div id="count">불러오는 중…</div>
    </div>
    <div class="rules" id="rules">자모 합성: 회전 ㄱ ↔ ㄴ · ㅏ → ㅜ → ㅓ → ㅗ · ㅡ ↔ ㅣ
쌍자음 ㄱ+ㄱ=ㄲ · ㄷ+ㄷ=ㄸ · ㅂ+ㅂ=ㅃ · ㅅ+ㅅ=ㅆ · ㅈ+ㅈ=ㅉ
겹모음 ㅗ+ㅏ=ㅘ · ㅗ+ㅣ=ㅚ · ㅜ+ㅓ=ㅝ · ㅜ+ㅣ=ㅟ · ㅡ+ㅣ=ㅢ · 파싱은 3→2→1글자 우선</div>
    <div class="controls">
      <input id="q" type="search" placeholder="단어, 이름, 설명, 특성 검색" autofocus />
      <select id="sort">
        <option value="no">번호순</option>
        <option value="dps">DPS 높은순</option>
        <option value="len">글자수</option>
        <option value="name">이름</option>
      </select>
    </div>
    <div class="tabs" id="tabs"></div>
  </header>
  <main><div class="grid" id="grid"></div></main>
  <script src="./lexicon.js"></script>
</body>
</html>
