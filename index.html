<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>한글 활자술사: 타워 디펜스 (Hangul Tower Defense)</title>
  <link rel="stylesheet" href="./src/css/style.css">
</head>
<body>
  <div id="app">
    <!-- TopBar -->
    <header class="top-bar">
      <div class="info-group">
        <span class="info-item hp" id="hp-label">기지 HP: 20 / 20</span>
        <span class="info-item gold" id="gold-label">40 G</span>
        <span class="info-item wave" id="wave-label">0 / 5 웨이브</span>
      </div>
      <div class="actions-group">
        <button id="btn-start-wave" class="btn btn-primary">▶ 다음 웨이브 시작</button>
        <button id="btn-save" class="btn">💾 저장</button>
        <button id="btn-load" class="btn">📂 이어하기</button>
        <button id="btn-speed" class="btn">▶ 1x 배속</button>
        <button id="btn-shop" class="btn btn-shop">🏪 상점</button>
        <button id="btn-lexicon" class="btn btn-lexicon">📖 단어 도감</button>
        <button id="btn-mute" class="btn btn-icon">🔊</button>
      </div>
    </header>

    <!-- Main Game Canvas (Winding Path & Towers) -->
    <main class="field-section">
      <canvas id="field-canvas"></canvas>
    </main>

    <!-- Bottom Jamo Belt Section -->
    <footer class="belt-section">
      <div class="belt-header">
        <span class="preview-text" id="preview-label">🏰 자동 완성 타워: [불 타워]</span>
        <button id="btn-buy-jamo" class="btn btn-small">➕ 자모 뽑기 (10 G)</button>
      </div>
      <div class="tiles-scroll">
        <div id="tiles-container" class="tiles-container"></div>
      </div>
    </footer>

    <!-- Modal Popup Container -->
    <div id="modal-overlay" class="modal-overlay" style="display: none;">
      <div id="modal-content" class="modal-wrapper"></div>
    </div>
  </div>

  <script type="module" src="./src/js/app.js"></script>
</body>
</html>
